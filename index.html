<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nazeeka Designs</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#fff;
  color:#14233d;
}

button{
  font-family:inherit;
  cursor:pointer;
}


/* ================= HEADER ================= */

.header{
  width:100%;
  overflow:hidden;
}

.header img{
  width:100%;
  height:auto;
  display:block;
}


/* ================= NAV ================= */

.nav{
  width:100%;
  background:#14233d;
  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:30px;
  padding:16px 12px;

  position:relative;
  z-index:10;
}

.nav button{
  background:none;
  border:0;
  color:#fff;

  font-size:16px;
  white-space:nowrap;

  padding:4px 6px;
}

.nav button:hover{
  opacity:.75;
}


/* ================= HOME ================= */

.home{
  text-align:center;
  padding:40px 15px 70px;
}

.brand{
  font-size:34px;
  font-weight:bold;
}

.brand-en{
  color:#777;
  font-size:18px;
  margin-top:6px;
}

.shop-now{
  margin-top:24px;

  background:#14233d;
  color:#fff;

  border:0;
  padding:13px 38px;

  border-radius:5px;
  font-size:16px;
}


/* ================= SECTION PAGES ================= */

.category-page{
  display:none;

  width:100%;
  max-width:1000px;

  margin:auto;

  padding:40px 15px 70px;
}

.category-page.active{
  display:block;
}

.category-heading{
  text-align:center;
  margin-bottom:30px;
}

.category-heading h1{
  font-size:32px;
}

.category-heading p{
  color:#777;
  margin-top:5px;
  font-size:17px;
}

.empty-category{
  text-align:center;
  color:#777;
  padding:50px 15px;
  font-size:18px;
}


/* ================= PRODUCTS ================= */

.products{
  width:100%;
  max-width:680px;

  margin:45px auto 0;

  display:grid;
  grid-template-columns:repeat(2,1fr);

  gap:18px;

  padding:0 10px;
}

.category-page .products{
  margin-top:0;
}

.product-card{
  border:1px solid #eee;
  border-radius:12px;

  overflow:hidden;

  background:#fff;

  box-shadow:0 4px 16px rgba(0,0,0,.06);

  cursor:pointer;

  transition:.2s;
}

.product-card:active{
  transform:scale(.98);
}

.product-card img{
  width:100%;

  aspect-ratio:4/5;

  max-height:340px;

  object-fit:cover;

  display:block;
}

.product-info{
  padding:13px 8px 17px;
}

.product-info h2{
  font-size:19px;
  font-weight:bold;
}

.product-info p{
  color:#777;
  font-size:13px;
  margin-top:4px;
}

.product-price{
  font-size:16px;
  font-weight:bold;
  margin-top:7px;
}


/* ================= PRODUCT PAGE ================= */

.product-page{
  display:none;

  width:100%;
  max-width:1000px;

  margin:auto;

  padding:25px 15px 70px;
}

.product-page.active{
  display:block;
}

.back{
  background:#14233d;
  color:#fff;

  border:0;

  padding:10px 20px;

  border-radius:5px;

  margin-bottom:25px;

  font-size:15px;
}

.product-heading{
  text-align:center;
  margin-bottom:25px;
}

.product-heading h1{
  font-size:32px;
}

.product-heading p{
  color:#777;
  margin-top:5px;
  font-size:17px;
}


/* ================= GALLERY ================= */

.gallery{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:14px;
}

.gallery img{
  width:100%;

  aspect-ratio:4/5;

  object-fit:cover;

  border-radius:10px;

  display:block;
}


/* ================= DETAILS ================= */

.details{
  text-align:center;

  padding:25px 10px;
}

.details-price{
  font-size:25px;
  font-weight:bold;
}

.sizes{
  color:#555;

  font-size:18px;

  margin:8px 0 20px;
}

.order-btn{
  background:#14233d;
  color:#fff;

  border:0;

  padding:13px 42px;

  border-radius:5px;

  font-size:16px;
}


/* ================= ORDER FORM ================= */

.order-form{
  display:none;

  width:100%;
  max-width:600px;

  margin:20px auto;

  padding:22px;

  background:#f7f7f7;

  border-radius:10px;
}

.order-form.active{
  display:block;
}

.order-form h2{
  text-align:center;
  margin-bottom:18px;
}

.order-form label{
  display:block;

  font-weight:bold;

  margin:12px 0 6px;
}

.order-form input,
.order-form select{

  width:100%;

  padding:12px;

  border:1px solid #ddd;

  border-radius:6px;

  background:#fff;

  font-family:inherit;
}

.send-order{

  width:100%;

  margin-top:20px;

  padding:14px;

  background:#14233d;

  color:#fff;

  border:0;

  border-radius:6px;

  font-size:16px;
}


/* ================= FOOTER ================= */

footer{
  background:#14233d;

  color:#fff;

  text-align:center;

  padding:25px;
}

.footer-title{
  font-size:20px;
  margin-bottom:8px;
}

.footer-contact{
  font-size:16px;
  opacity:.9;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

  .nav{
    gap:10px;
    padding:14px 5px;
  }

  .nav button{
    font-size:13px;
    padding:3px 2px;
  }

  .home{
    padding:35px 12px 60px;
  }

  .brand{
    font-size:29px;
  }

  .brand-en{
    font-size:16px;
  }

  .shop-now{
    padding:12px 32px;
    font-size:15px;
  }

  .products{
    max-width:500px;

    grid-template-columns:repeat(2,1fr);

    gap:10px;

    padding:0 8px;

    margin-top:38px;
  }

  .category-page .products{
    margin-top:0;
  }

  .product-card img{
    max-height:280px;
  }

  .product-info{
    padding:10px 5px 13px;
  }

  .product-info h2{
    font-size:16px;
  }

  .product-info p{
    font-size:11px;
  }

  .product-price{
    font-size:14px;
  }

  .gallery{
    grid-template-columns:1fr;
    gap:12px;
  }

  .gallery img{
    aspect-ratio:auto;
  }

  .product-heading h1{
    font-size:28px;
  }

  .product-heading p{
    font-size:15px;
  }

}


/* ================= VERY SMALL PHONES ================= */

@media(max-width:380px){

  .nav{
    gap:5px;
  }

  .nav button{
    font-size:12px;
  }

  .products{
    gap:8px;
  }

  .product-card img{
    max-height:245px;
  }

}

</style>
</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

  <img
    src="IMG_7119.jpeg"
    alt="Nazeeka Designs"
  >

</header>


<!-- ================= NAV ================= -->

<nav class="nav">

  <button onclick="goHome()">
    الرئيسية | Home
  </button>

  <button onclick="goClothing()">
    الملابس | Clothing
  </button>

  <button onclick="goHijabs()">
    الطرح | Hijabs
  </button>

</nav>


<!-- ================= HOME ================= -->

<section id="home" class="home">

  <div class="brand">
    نزيكة دزينز
  </div>

  <div class="brand-en">
    Nazeeka Designs
  </div>

  <button
    class="shop-now"
    onclick="goClothing()"
  >
    SHOP NOW
  </button>

</section>


<!-- ================================================= -->
<!-- ================= CLOTHING PAGE ================= -->
<!-- ================================================= -->

<section
  id="clothing"
  class="category-page"
>

  <div class="category-heading">

    <h1>
      الملابس | Clothing
    </h1>

    <p>
      Nazeeka Designs
    </p>

  </div>


  <div class="products">

    <!-- ================= ZAHRA ================= -->

    <div
      class="product-card"
      onclick="openProduct('zahra')"
    >

      <img
        src="D98746B7-79A5-48BF-90E9-8058295BDC23.png"
        alt="زهرة"
      >

      <div class="product-info">

        <h2>
          زهرة
        </h2>

        <p>
          Zahra
        </p>

        <div class="product-price">
          550 EGP
        </div>

      </div>

    </div>

  </div>

</section>


<!-- ================================================= -->
<!-- ================= HIJABS PAGE =================== -->
<!-- ================================================= -->

<section
  id="hijabs"
  class="category-page"
>

  <div class="category-heading">

    <h1>
      الطرح | Hijabs
    </h1>

    <p>
      Nazeeka Designs
    </p>

  </div>


  <div class="empty-category">

    الطرح قريبًا

  </div>

</section>


<!-- ================================================= -->
<!-- ================= ZAHRA PAGE ==================== -->
<!-- ================================================= -->

<section
  id="zahra"
  class="product-page"
>

  <button
    class="back"
    onclick="goClothing()"
  >
    العودة للملابس
  </button>


  <div class="product-heading">

    <h1>
      زهرة
    </h1>

    <p>
      Zahra
    </p>

  </div>


  <div class="gallery">

    <img
      src="D98746B7-79A5-48BF-90E9-8058295BDC23.png"
      alt="زهرة"
    >

    <img
      src="22B19411-75CA-479F-A1C1-EE8DC7493C20.png"
      alt="زهرة"
    >

    <img
      src="3C04AD25-007D-4866-AEF3-1C9986EDEEA7.png"
      alt="زهرة"
    >

  </div>


  <div class="details">

    <div class="details-price">
      550 EGP
    </div>

    <div class="sizes">
      L / XL / XXL
    </div>

    <button
      class="order-btn"
      onclick="openOrder('zahra-order')"
    >
      اطلبي الآن
    </button>

  </div>


  <div
    id="zahra-order"
    class="order-form"
  >

    <h2>
      بيانات الطلب
    </h2>


    <label>
      الاسم
    </label>

    <input
      id="zahra-name"
      type="text"
      placeholder="اكتبي اسمك"
    >


    <label>
      رقم الموبايل
    </label>

    <input
      id="zahra-phone"
      type="tel"
      placeholder="اكتبي رقم الموبايل"
    >


    <label>
      المقاس
    </label>

    <select id="zahra-size">

      <option value="">
        اختاري المقاس
      </option>

      <option value="L">
        L
      </option>

      <option value="XL">
        XL
      </option>

      <option value="XXL">
        XXL
      </option>

    </select>


    <label>
      العنوان
    </label>

    <input
      id="zahra-address"
      type="text"
      placeholder="اكتبي العنوان بالتفصيل"
    >


    <button
      class="send-order"
      onclick="sendOrder(
        'زهرة',
        '550',
        'zahra-name',
        'zahra-phone',
        'zahra-size',
        'zahra-address'
      )"
    >
      إرسال الطلب على واتساب
    </button>

  </div>

</section>


<!-- ================= FOOTER ================= -->

<footer>

  <div class="footer-title">
    نزيكة دزينز | Nazeeka Designs
  </div>

  <div class="footer-contact">
    للتواصل والطلبات
  </div>

</footer>


<script>


/* ================= WHATSAPP ================= */

const whatsappNumber = "201029153023";


/* ================= HIDE ALL PAGES ================= */

function hideAllPages(){

  document
    .querySelectorAll(".category-page, .product-page")
    .forEach(function(page){

      page.classList.remove("active");
      page.style.display = "none";

    });

}


/* ================= HOME ================= */

function goHome(){

  hideAllPages();

  document.getElementById("home").style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================= CLOTHING ================= */

function goClothing(){

  hideAllPages();

  document.getElementById("home").style.display = "none";

  document.getElementById("clothing").style.display = "block";
  document.getElementById("clothing").classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================= HIJABS ================= */

function goHijabs(){

  hideAllPages();

  document.getElementById("home").style.display = "none";

  document.getElementById("hijabs").style.display = "block";
  document.getElementById("hijabs").classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================= OPEN PRODUCT ================= */

function openProduct(product){

  hideAllPages();

  document.getElementById("home").style.display = "none";

  document
    .getElementById(product)
    .style.display = "block";

  document
    .getElementById(product)
    .classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================= OPEN ORDER ================= */

function openOrder(id){

  document
    .getElementById(id)
    .classList.add("active");

  setTimeout(function(){

    document
      .getElementById(id)
      .scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

  },100);

}


/* ================= SEND ORDER ================= */

function sendOrder(
  product,
  price,
  nameId,
  phoneId,
  sizeId,
  addressId
){

  const name =
    document
      .getElementById(nameId)
      .value
      .trim();


  const phone =
    document
      .getElementById(phoneId)
      .value
      .trim();


  const size =
    document
      .getElementById(sizeId)
      .value;


  const address =
    document
      .getElementById(addressId)
      .value
      .trim();


  if(
    name === "" ||
    phone === "" ||
    size === "" ||
    address === ""
  ){

    alert(
      "من فضلك اكملي كل بيانات الطلب"
    );

    return;

  }


  const message =

    "طلب جديد من Nazeeka Designs\n\n" +

    "القطعة: " +
    product +
    "\n" +

    "السعر: " +
    price +
    " EGP\n" +

    "المقاس: " +
    size +
    "\n" +

    "الاسم: " +
    name +
    "\n" +

    "رقم الموبايل: " +
    phone +
    "\n" +

    "العنوان: " +
    address;


  const whatsappLink =

    "https://wa.me/" +

    whatsappNumber +

    "?text=" +

    encodeURIComponent(message);


  window.location.href =
    whatsappLink;

}

</script>

</body>
</html>
