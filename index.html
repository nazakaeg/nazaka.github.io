<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nazeeka Designs</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#fff;
  color:#12233f;
}

/* الهيدر */
.hero{
  width:100%;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:auto;
  display:block;
}

/* القائمة */
nav{
  background:#12233f;
  padding:16px;
  text-align:center;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 12px;
  font-size:16px;
}

/* عنوان الموقع */
.title{
  text-align:center;
  padding:45px 20px 30px;
}

.title h2{
  font-size:30px;
  margin-bottom:10px;
}

.title p{
  color:#777;
  font-size:20px;
}

/* المنتجات */
.products{
  max-width:1100px;
  margin:auto;
  padding:10px 20px 50px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:30px;
}

.card{
  border:1px solid #eee;
  border-radius:15px;
  overflow:hidden;
  background:white;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

/* صور المنتج */
.product-images{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:2px;
  background:#f5f5f5;
}

.product-images img{
  width:100%;
  height:360px;
  object-fit:cover;
  display:block;
}

/* معلومات المنتج */
.info{
  padding:22px;
  text-align:center;
}

.info h3{
  font-size:23px;
  margin-bottom:12px;
}

.sizes{
  color:#666;
  font-size:16px;
  margin-bottom:10px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin-bottom:18px;
}

.button{
  display:block;
  background:#12233f;
  color:white;
  text-decoration:none;
  padding:13px;
  border-radius:10px;
}

/* الفوتر */
footer{
  background:#12233f;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:20px;
}

/* الموبايل */
@media(max-width:700px){

  nav a{
    margin:0 6px;
    font-size:14px;
  }

  .products{
    grid-template-columns:1fr;
    padding:10px 15px 40px;
  }

  .product-images img{
    height:300px;
  }

  .title h2{
    font-size:26px;
  }
}
</style>
</head>

<body>

<!-- الهيدر -->
<header class="hero">
  <img src="IMG_7119.jpeg" alt="Nazeeka Designs">
</header>

<!-- القائمة -->
<nav>
  <a href="#home">الرئيسية</a>
  <a href="#items">الـItems</a>
  <a href="#contact">تواصل معنا</a>
</nav>

<!-- العنوان -->
<section class="title" id="home">
  <h2>Nazeeka Designs</h2>
  <p>كِنِ نزيكة</p>
</section>

<!-- الـItems -->
<section class="products" id="items">

  <!-- زهرة -->
  <div class="card">

    <div class="product-images">

      <img
        src="22B19411-75CA-479F-A1C1-EE8DC7493C20.png"
        alt="زهرة">

      <img
        src="3C04AD25-007D-4866-AEF3-1C9986EDEEA7.png"
        alt="زهرة">

      <img
        src="D98746B7-79A5-48BF-90E9-8058295BDC23.png"
        alt="زهرة">

    </div>

    <div class="info">

      <h3>زهرة</h3>

      <div class="sizes">
        L / XL / XXL
      </div>

      <div class="price">
        550 جنيه
      </div>

      <a class="button" href="#contact">
        اطلبي الآن
      </a>

    </div>

  </div>


  <!-- كِنِ نزيكة -->
  <div class="card">

    <div class="product-images">

      <img
        src="621F3C2C-6D32-44AE-AA84-E94368B943E7.png"
        alt="كِنِ نزيكة">

      <img
        src="E3292A35-1F0E-4B59-BB55-D0A3E9739CDD.png"
        alt="كِنِ نزيكة">

      <img
        src="930D65BE-D0BB-4CBC-BF43-EF67AF8062E6.png"
        alt="كِنِ نزيكة">

    </div>

    <div class="info">

      <h3>كِنِ نزيكة</h3>

      <div class="sizes">
        L / XL / XXL
      </div>

      <div class="price">
        599 جنيه
      </div>

      <a class="button" href="#contact">
        اطلبي الآن
      </a>

    </div>

  </div>

</section>

<!-- التواصل -->
<footer id="contact">
  <p>Nazeeka Designs © 2026</p>
  <p>للطلب والتواصل معنا</p>
</footer>

</body>
</html>
