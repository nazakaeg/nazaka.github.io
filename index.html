<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كنِ نزيكة | Nazeeka Designs</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#fff;
color:#12233f
}

.hero img{
width:100%;
display:block
}

nav{
background:#12233f;
padding:16px;
text-align:center
}

nav a{
color:#fff;
text-decoration:none;
font-size:16px
}

.intro{
text-align:center;
padding:55px 20px 35px
}

.intro h1{
font-size:34px;
margin-bottom:10px
}

.intro p{
color:#777;
font-size:18px
}

.shop-button{
display:inline-block;
margin-top:25px;
padding:13px 38px;
background:#12233f;
color:#fff;
text-decoration:none;
border-radius:8px
}

.shop{
max-width:1000px;
margin:auto;
padding:30px 20px 70px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px
}

.product-card{
color:#12233f;
text-align:center;
border:1px solid #eee;
border-radius:14px;
overflow:hidden;
background:#fff;
box-shadow:0 4px 15px rgba(0,0,0,.06);
cursor:pointer
}

.product-card img{
width:100%;
height:500px;
object-fit:cover;
display:block
}

.product-info{
padding:18px
}

.product-info h2{
font-size:21px;
margin-bottom:8px
}

.product-info p{
font-size:18px
}

.product-page{
display:none;
max-width:1050px;
margin:auto;
padding:45px 20px 70px
}

.product-page.active{
display:block
}

.product-page h1{
text-align:center;
font-size:32px;
margin-bottom:30px
}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}

.gallery img{
width:100%;
height:500px;
object-fit:cover;
border-radius:12px
}

.details{
text-align:center;
padding:35px 10px
}

.price{
font-size:24px;
font-weight:bold;
margin-bottom:18px
}

.sizes{
font-size:18px;
margin-bottom:25px
}

.order-button,
.submit-order{
background:#12233f;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer
}

.order-button{
padding:14px 50px
}

.order-box{
display:none;
max-width:600px;
margin:25px auto;
padding:25px;
background:#f7f7f7;
border-radius:15px
}

.order-box.active{
display:block
}

.order-box h2{
text-align:center;
margin-bottom:20px
}

.order-box label{
display:block;
margin:12px 0 6px;
font-weight:bold
}

.order-box input,
.order-box select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
background:#fff
}

.submit-order{
width:100%;
margin-top:20px;
padding:14px
}

.back{
display:block;
text-align:center;
margin-top:25px;
color:#12233f;
text-decoration:none
}

footer{
background:#12233f;
color:#fff;
text-align:center;
padding:25px
}

@media(max-width:700px){

.intro h1{
font-size:28px
}

.shop{
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:25px 12px 50px
}

.product-card img{
height:280px
}

.product-info{
padding:13px 5px
}

.product-info h2{
font-size:16px
}

.product-info p{
font-size:16px
}

.gallery{
grid-template-columns:1fr;
gap:15px
}

.gallery img{
height:auto;
max-height:650px
}

.product-page h1{
font-size:28px
}

}
</style>
</head>

<body>

<header class="hero">
<img src="IMG_7119.jpeg" alt="Nazeeka Designs">
</header>

<nav>
<a href="#" onclick="showHome();return false;">
الرئيسية | HOME
</a>
</nav>


<section id="home">

<section class="intro">

<h1>كنِ نزيكة</h1>

<p>Nazeeka Designs</p>

<a href="#shop" class="shop-button">
SHOP NOW
</a>

</section>


<section class="shop" id="shop">


<div class="product-card"
onclick="showProduct('zahra')">

<img
src="22B19411-75CA-479F-A1C1-EE8DC7493C20.png"
alt="زهرة"
>

<div class="product-info">

<h2>زهرة</h2>

<p>550</p>

</div>

</div>


<div class="product-card"
onclick="showProduct('nazeeka')">

<img
src="621F3C2C-6D32-44AE-AA84-E94368B943E7.png"
alt="كن نزيكة"
>

<div class="product-info">

<h2>كن نزيكة</h2>

<p>599</p>

</div>

</div>


</section>

</section>


<section id="zahra" class="product-page">

<h1>زهرة</h1>

<div class="gallery">

<img src="D98746B7-79A5-48BF-90E9-8058295BDC23.png">

<img src="3C04AD25-007D-4866-AEF3-1C9986EDEEA7.png">

<img src="22B19411-75CA-479F-A1C1-EE8DC7493C20.png">

</div>


<div class="details">

<div class="price">
السعر: 550
</div>

<div class="sizes">
المقاسات: L / XL / XXL
</div>

<button
class="order-button"
onclick="openOrder('zahra')"
>
اطلبي الآن
</button>

</div>


<div id="order-zahra" class="order-box">

<h2>بيانات الطلب</h2>

<label>الاسم</label>
<input
id="name-zahra"
type="text"
placeholder="اكتبي اسمك"
>

<label>رقم الموبايل</label>
<input
id="phone-zahra"
type="tel"
placeholder="اكتبي رقم الموبايل"
>

<label>العنوان</label>
<input
id="address-zahra"
type="text"
placeholder="اكتبي العنوان بالتفصيل"
>

<label>المقاس</label>

<select id="size-zahra">

<option value="">
اختاري المقاس
</option>

<option value="L">L</option>
<option value="XL">XL</option>
<option value="XXL">XXL</option>

</select>

<label>الكمية</label>

>

>

</button>

</div>


<a
href="#"
class="back"

العودة للرئيسية
</a>

</section>



<section id="nazeeka" class="product-page">

<h1>كن نزيكة</h1>

<div class="gallery">

<img src="621F3C2C-6D32-44AE-AA84-E94368B943E7.png">

<img src="3384CB47-29AD-431C-96EB-95AF6F0416AB.png">

<img src="70F43FE0-0B09-42AF-A461-CF039DC95B7D.png">

</div>


<div class="details">

<div class="price">
السعر: 599
</div>

<div class="sizes">
المقاسات: L / XL / XXL
</div>

<button
class="order-button"
onclick="openOrder('nazeeka')"
>
اطلبي الآن
</button>

</div>


<div id="order-nazeeka" class="order-box">

<h2>بيانات الطلب</h2>

<label>الاسم</label>

<input
id="name-nazeeka"
type="text"
placeholder="اكتبي اسمك"
>

<label>رقم الموبايل</label>

<input
id="phone-nazeeka"
type="tel"
placeholder="اكتبي رقم الموبايل"
>

<label>العنوان</label>

<input
id="address-nazeeka"
type="text"
placeholder="اكتبي العنوان بالتفصيل"
>

<label>المقاس</label>

<select id="size-nazeeka">

<option value="">
اختاري المقاس
</option>

<option value="L">L</option>
<option value="XL">XL</option>
<option value="XXL">XXL</option>

</select>

<label>الكمية</label>

<input
id="quantity-nazeeka"
type="number"
min="1"
value="1"
>

<button
class="submit-order"
onclick="sendOrder('كن نزيكة',599,'nazeeka')"
>
تأكيد الطلب
</button>

</div>


<a
href="#"
class="back"
onclick="showHome();return false;"
>
العودة للرئيسية
</a>

</section>


<footer>
<p>Nazeeka Designs © 2026</p>
</footer>


<script>

function showProduct(product){

document.getElementById("home").style.display="none";

document
.querySelectorAll(".product-page")
.forEach(function(page){

page.classList.remove("active");

});

document
.getElementById(product)
.classList.add("active");

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function showHome(){

document.getElementById("home").style.display="block";

document
.querySelectorAll(".product-page")
.forEach(function(page){

page.classList.remove("active");

});

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function openOrder(product){

const box=
document.getElementById("order-"+product);

box.classList.add("active");

box.scrollIntoView({
behavior:"smooth"
});

}


function sendOrder(product,price,type){

const name=
document
.getElementById("name-"+type)
.value.trim();

const phone=
document
.getElementById("phone-"+type)
.value.trim();

const address=
document
.getElementById("address-"+type)
.value.trim();

const size=
document
.getElementById("size-"+type)
.value;

const quantity=
document
.getElementById("quantity-"+type)
.value;


if(
!name ||
!phone ||
!address ||
!size
){

alert("من فضلك اكملي كل بيانات الطلب");

return;

}


const message=

`طلب جديد من Nazeeka Designs

القطعة: ${product}

السعر: ${price}

الاسم: ${name}

رقم الموبايل: ${phone}

العنوان: ${address}

المقاس: ${size}

الكمية: ${quantity}`;


const whatsapp=
"https://wa.me/201029153023?text="+
encodeURIComponent(message);


window.open(
whatsapp,
"_blank"
);

}

</script>

</body>
</html>
