<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nazeeka Designs</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#fff;
  color:#12233f;
}

/* الهيدر */
.hero{
  width:100%;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:auto;
  display:block;
}

/* شريط التنقل */
nav{
  background:#12233f;
  padding:16px;
  text-align:center;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 12px;
  font-size:16px;
}

/* عنوان المنتجات */
.products-section{
  max-width:1100px;
  margin:auto;
  padding:50px 20px;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h2{
  font-size:30px;
  margin-bottom:10px;
}

.title p{
  color:#777;
}

/* المنتجات */
.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.card{
  border:1px solid #eee;
  border-radius:15px;
  overflow:hidden;
  background:white;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.product-image{
  height:300px;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
}

.info{
  padding:20px;
  text-align:center;
}

.info h3{
  font-size:20px;
  margin-bottom:10px;
}

.price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

.button{
  display:block;
  background:#12233f;
  color:white;
  text-decoration:none;
  padding:12px;
  border-radius:10px;
}

/* الفوتر */
footer{
  background:#12233f;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

/* الموبايل */
@media(max-width:700px){

  nav a{
    margin:0 6px;
    font-size:14px;
  }

  .products{
    grid-template-columns:1fr;
  }

  .product-image{
    height:330px;
  }

  .title h2{
    font-size:26px;
  }
}
</style>
</head>

<body>

<!-- الهيدر -->
<header class="hero">
  <img src="IMG_7119.jpeg" alt="Nazeeka Designs">
</header>

<!-- القائمة -->
<nav>
  <a href="#home">الرئيسية</a>
  <a href="#products">المنتجات</a>
  <a href="#contact">تواصل معنا</a>
</nav>

<!-- المنتجات -->
<section class="products-section" id="products">

  <div class="title">
    <h2>منتجات Nazeeka Designs</h2>
    <p>اختاري القطعة المناسبة ليكي ✨</p>
  </div>

  <div class="products">

    <div class="card">
      <div class="product-image">
        صورة المنتج
      </div>

      <div class="info">
        <h3>اسم المنتج</h3>
        <div class="price">999 جنيه</div>
        <a class="button" href="#contact">اطلبي الآن</a>
      </div>
    </div>

    <div class="card">
      <div class="product-image">
        صورة المنتج
      </div>

      <div class="info">
        <h3>اسم المنتج</h3>
        <div class="price">999 جنيه</div>
        <a class="button" href="#contact">اطلبي الآن</a>
      </div>
    </div>

    <div class="card">
      <div class="product-image">
        صورة المنتج
      </div>

      <div class="info">
        <h3>اسم المنتج</h3>
        <div class="price">999 جنيه</div>
        <a class="button" href="#contact">اطلبي الآن</a>
      </div>
    </div>

  </div>
</section>

<!-- التواصل -->
<footer id="contact">
  <p>Nazeeka Designs © 2026</p>
  <p>للطلب والتواصل معنا 💌</p>
</footer>

</body>
</html>
