<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نزيكة دزينز | Nazeeka Designs</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#fff;
  color:#14233d;
}

button{
  font-family:inherit;
  cursor:pointer;
}

/* ================= HEADER ================= */

.header{
  width:100%;
}

.header img{
  width:100%;
  display:block;
}


/* ================= NAV ================= */

.nav{
  background:#14233d;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:35px;
  padding:17px 15px;
}

.nav button{
  background:none;
  border:0;
  color:#fff;
  font-size:16px;
}


/* ================= HOME ================= */

.home{
  text-align:center;
  padding:45px 15px 70px;
}

.brand{
  font-size:36px;
  font-weight:bold;
}

.brand-en{
  color:#777;
  font-size:18px;
  margin-top:5px;
}

.shop-now{
  margin-top:25px;
  background:#14233d;
  color:#fff;
  border:0;
  padding:14px 40px;
  border-radius:5px;
  font-size:16px;
}


/* ================= PRODUCTS ================= */

.products{
  max-width:820px;
  margin:50px auto 0;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
}

.product-card{
  border:1px solid #eee;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
  cursor:pointer;
}

.product-card img{
  width:100%;
  aspect-ratio:4/5;
  max-height:430px;
  object-fit:cover;
  display:block;
}

.product-info{
  padding:18px 10px 22px;
}

.product-info h2{
  font-size:23px;
}

.product-info p{
  color:#777;
  margin-top:4px;
}

.product-price{
  font-size:19px;
  font-weight:bold;
  margin-top:8px;
}


/* ================= PRODUCT PAGE ================= */

.product-page{
  display:none;
  max-width:1050px;
  margin:auto;
  padding:35px 15px 70px;
}

.product-page.active{
  display:block;
}

.back{
  background:#14233d;
  color:#fff;
  border:0;
  padding:11px 22px;
  border-radius:5px;
  margin-bottom:30px;
}

.product-heading{
  text-align:center;
  margin-bottom:30px;
}

.product-heading h1{
  font-size:34px;
}

.product-heading p{
  color:#777;
  margin-top:5px;
}


/* ================= GALLERY ================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.gallery img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  border-radius:10px;
}


/* ================= DETAILS ================= */

.details{
  text-align:center;
  padding:30px 10px;
}

.details-price{
  font-size:25px;
  font-weight:bold;
}

.sizes{
  color:#555;
  font-size:18px;
  margin:8px 0 22px;
}

.order-btn{
  background:#14233d;
  color:#fff;
  border:0;
  padding:14px 45px;
  border-radius:5px;
  font-size:16px;
}


/* ================= ORDER FORM ================= */

.order-form{
  display:none;
  max-width:600px;
  margin:20px auto;
  padding:25px;
  background:#f7f7f7;
  border-radius:10px;
}

.order-form.active{
  display:block;
}

.order-form h2{
  text-align:center;
  margin-bottom:20px;
}

.order-form label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

.order-form input,
.order-form select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:6px;
  background:#fff;
}

.send-order{
  width:100%;
  margin-top:20px;
  padding:14px;
  background:#14233d;
  color:#fff;
  border:0;
  border-radius:6px;
  font-size:16px;
}


/* ================= FOOTER ================= */

footer{
  background:#14233d;
  color:#fff;
  text-align:center;
  padding:25px;
}

.footer-title{
  font-size:20px;
  margin-bottom:8px;
}

.footer-contact{
  font-size:16px;
  opacity:.9;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

  .nav{
    gap:18px;
  }

  .nav button{
    font-size:14px;
  }

  .brand{
    font-size:30px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 10px;
  }

  .product-card img{
    max-height:330px;
  }

  .product-info{
    padding:12px 5px 15px;
  }

  .product-info h2{
    font-size:17px;
  }

  .product-info p{
    font-size:12px;
  }

  .product-price{
    font-size:15px;
  }

  .gallery{
    grid-template-columns:1fr;
  }

  .gallery img{
    aspect-ratio:auto;
  }

  .product-heading h1{
    font-size:29px;
  }
}
</style>
</head>


<body>

    </h1>

  <div class="gallery">

      src="D98746B7-79A5-48BF-90E9-8058295BDC23.png"

    >

    <img
      src="22B19411-75CA-479F-A1C1-EE8DC7493C20.png"
      alt="زهرة"
    >

      src="3C04AD25-007D-4866-AEF3-1C9986EDEEA7.png"

<!-- ================= FOOTER ================= -->

<footer id="contact">

  <div class="footer-title">
    نزيكة دزينز | Nazeeka Designs
  </div>

  <div class="footer-contact">
    للتواصل والطلبات
  </div>

</footer>



<script>

/* رقم الواتساب */

const whatsappNumber = "201029153023";


/* الرئيسية */

function goHome(){

  document.getElementById("home").style.display = "block";

  document.querySelectorAll(".product-page").forEach(function(page){

    page.classList.remove("active");

  });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* تسوقي الآن */

function goShop(){

  goHome();

  setTimeout(function(){

    document
      .getElementById("products")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  },100);

}


/* تواصل معنا */

function goContact(){

  document
    .getElementById("contact")
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

}


/* فتح المنتج */

function openProduct(product){

  document.getElementById("home").style.display = "none";

  document.querySelectorAll(".product-page").forEach(function(page){

    page.classList.remove("active");

  });

  document
    .getElementById(product)
    .classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* فتح نموذج الطلب */

function openOrder(id){

  document
    .getElementById(id)
    .classList.add("active");

  setTimeout(function(){

    document
      .getElementById(id)
      .scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

  },100);

}


/* إرسال الطلب */

function sendOrder(
  product,
  price,
  nameId,
  phoneId,
  sizeId,
  addressId
){

  const name =
    document.getElementById(nameId).value.trim();

  const phone =
    document.getElementById(phoneId).value.trim();

  const size =
    document.getElementById(sizeId).value;

  const address =
    document.getElementById(addressId).value.trim();


  if(
    name === "" ||
    phone === "" ||
    size === "" ||
    address === ""
  ){

    alert(
      "من فضلك اكملي كل بيانات الطلب"
    );

    return;

  }


  const message =

    "طلب جديد من Nazeeka Designs\n\n" +

    "القطعة: " +
    product +
    "\n" +

    "السعر: " +
    price +
    " EGP\n" +

    "المقاس: " +
    size +
    "\n" +

    "الاسم: " +
    name +
    "\n" +

    "رقم الموبايل: " +
    phone +
    "\n" +

    "العنوان: " +
    address;


  const whatsappLink =

    "https://wa.me/" +

    whatsappNumber +

    "?text=" +

    encodeURIComponent(message);


  window.location.href =
    whatsappLink;

}

</script>
