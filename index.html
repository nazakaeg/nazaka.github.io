<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nazeeka Designs</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#fff;
  color:#12233f;
}

/* الهيدر */

.hero{
  width:100%;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:auto;
  display:block;
}

/* القائمة */

nav{
  background:#12233f;
  padding:18px 10px;
  text-align:center;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 12px;
  font-size:16px;
}

/* الأقسام */

.section{
  max-width:1100px;
  margin:auto;
  padding:55px 20px;
}

.section-title{
  text-align:center;
  margin-bottom:35px;
}

.section-title h2{
  font-size:30px;
  margin-bottom:12px;
}

.section-title p{
  color:#777;
  font-size:18px;
}

/* المنتجات */

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.card{
  border:1px solid #eee;
  border-radius:15px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card img{
  width:100%;
  height:420px;
  object-fit:cover;
  display:block;
}

.info{
  padding:15px;
  text-align:center;
}

.info h3{
  font-size:18px;
  margin-bottom:10px;
}

.button{
  display:block;
  background:#12233f;
  color:white;
  text-decoration:none;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  border:none;
  width:100%;
  font-size:15px;
  cursor:pointer;
}

/* الخط الفاصل */

.divider{
  height:1px;
  background:#eee;
  margin:10px 20px;
}

/* فورم الطلب */

.order-box{
  display:none;
  max-width:600px;
  margin:30px auto;
  padding:25px;
  background:#f8f8f8;
  border-radius:18px;
  border:1px solid #eee;
}

.order-box h2{
  text-align:center;
  margin-bottom:20px;
}

.order-box label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
}

.order-box input,
.order-box select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  background:white;
}

.whatsapp-button{
  background:#12233f;
  color:white;
  border:none;
  width:100%;
  padding:14px;
  border-radius:10px;
  font-size:17px;
  margin-top:20px;
  cursor:pointer;
}

.cancel-button{
  background:#ddd;
  color:#12233f;
  border:none;
  width:100%;
  padding:12px;
  border-radius:10px;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
}

/* التواصل */

footer{
  background:#12233f;
  color:white;
  text-align:center;
  padding:30px 20px;
  margin-top:30px;
}

footer p{
  margin:7px;
}


/* ========================= */
/* الموبايل */
/* ========================= */

@media(max-width:700px){

  nav a{
    margin:0 6px;
    font-size:14px;
  }

  .section{
    padding:45px 15px;
  }

  .section-title h2{
    font-size:27px;
  }

  .section-title p{
    font-size:16px;
  }

  /* صورتين جنب بعض */

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card{
    border-radius:10px;
  }

  .card img{
    width:100%;
    height:260px;
    object-fit:cover;
  }

  .info{
    padding:10px 7px;
  }

  .info h3{
    font-size:15px;
  }

  .button{
    font-size:13px;
    padding:10px 5px;
  }

  .order-box{
    margin:25px 15px;
  }

}


/* شاشات صغيرة جدًا */

@media(max-width:380px){

  .products{
    gap:8px;
  }

  .card img{
    height:220px;
  }

  .info h3{
    font-size:14px;
  }

}


/* الكمبيوتر */

@media(min-width:701px){

  .products{
    grid-template-columns:repeat(3,1fr);
  }

}

</style>

</head>


<body>


<!-- ========================= -->
<!-- الهيدر -->
<!-- ========================= -->

<header class="hero" id="home">

  <img
    src="IMG_7119.jpeg"
    alt="Nazeeka Designs">

</header>


<!-- ========================= -->
<!-- القائمة -->
<!-- ========================= -->

<nav>

  <a href="#home">
    الرئيسية
  </a>

  <a href="#kan">
    كن نزيكة
  </a>

  <a href="#zahra">
    زهرة
  </a>

  <a href="#contact">
    تواصل معنا
  </a>

</nav>


<!-- ========================= -->
<!-- كن نزيكة -->
<!-- ========================= -->

<section class="section" id="kan">

  <div class="section-title">

    <h2>
      كن نزيكة
    </h2>

    <p>
      Nazeeka Designs
    </p>

  </div>


  <div class="products">


    <!-- الصورة الأولى -->

    <div class="card">

      <img
        src="621F3C2C-6D32-44AE-AA84-E94368B943E7.png"
        alt="كن نزيكة">

      <div class="info">

        <h3>
          كن نزيكة
        </h3>

        <button
          class="button"
          onclick="openOrder('كن نزيكة')">

          اطلبي الآن

        </button>

      </div>

    </div>


    <!-- الصورة الثانية -->

    <div class="card">

      <img
        src="E3292A35-1F0E-4B59-BB55-D0A3E9739CDD.png"
        alt="كن نزيكة">

      <div class="info">

        <h3>
          كن نزيكة
        </h3>

        <button
          class="button"
          onclick="openOrder('كن نزيكة')">

          اطلبي الآن

        </button>

      </div>

    </div>


    <!-- الصورة الثالثة -->

    <div class="card">

      <img
        src="930D65BE-D0BB-4CBC-BF43-EF67AF8062E6.png"
        alt="كن نزيكة">

      <div class="info">

        <h3>
          كن نزيكة
        </h3>

        <button
          class="button"
          onclick="openOrder('كن نزيكة')">

          اطلبي الآن

        </button>

    </div>

</section>


<div class="divider"></div>


<!-- ========================= -->
<!-- زهرة -->
<!-- ========================= -->

<section class="section" id="zahra">

  <div class="section-title">

    <h2>
      زهرة
    </h2>

    <p>
      شاهدي القطعة من كل التفاصيل
    </p>

  </div>


  <div class="products">


    <!-- زهرة الأولى -->

    <div class="card">

      <img
        src="22B19411-75CA-479F-A1C1-EE8DC7493C20.png"
        alt="زهرة">

      <div class="info">

        <h3>
          زهرة
        </h3>

        <button
          class="button"
          onclick="openOrder('زهرة')">

          اطلبي الآن

        </button>

      </div>

    </div>


    <!-- زهرة الثانية -->

    <div class="card">

      <img
        src="3C04AD25-007D-4866-AEF3-1C9986EDEEA7.png"
        alt="زهرة">

      <div class="info">

        <h3>
          زهرة
        </h3>

        <button
          class="button"
          onclick="openOrder('زهرة')">

          اطلبي الآن

        </button>

      </div>

    </div>


    <!-- زهرة الثالثة -->

    <div class="card">

      <img
        src="D98746B7-79A5-48BF-90E9-8058295BDC23.png"
        alt="زهرة">

      <div class="info">

        <h3>
          زهرة
        </h3>

        <button
          class="button"
          onclick="openOrder('زهرة')">

          اطلبي الآن

        </button>

      </div>

    </div>


  </div>

</section>


<!-- ========================= -->
<!-- فورم الطلب -->
<!-- ========================= -->

<div
  class="order-box"
  id="orderBox">


  <h2>
    بيانات الطلب
  </h2>


  <label>
    الاسم
  </label>

  <input
    type="text"
    id="customerName"
    placeholder="اكتبي اسمك">


  <label>
    رقم الموبايل
  </label>

  <input
    type="tel"
    id="customerPhone"
    placeholder="اكتبي رقم الموبايل">


  <label>
    العنوان
  </label>

  <input
    type="text"
    id="customerAddress"
    placeholder="اكتبي العنوان بالتفصيل">


  <label>
    القطعة
  </label>

  <input
    type="text"
    id="productName"
    readonly>


  <label>
    المقاس
  </label>

  <select id="size">

    <option value="">
      اختاري المقاس
    </option>

    <option value="XS">
      XS
    </option>

    <option value="S">
      S
    </option>

    <option value="M">
      M
    </option>

    <option value="L">
      L
    </option>

    <option value="XL">
      XL
    </option>

    <option value="XXL">
      XXL
    </option>

  </select>


  <label>
    الكمية
  </label>

  <input
    type="number"
    id="quantity"
    min="1"
    value="1">


  <button
    class="whatsapp-button"
    onclick="sendOrder()">

    تأكيد الطلب عبر واتساب

  </button>


  <button
    class="cancel-button"
    onclick="closeOrder()">

    إلغاء

  </button>


</div>


<!-- ========================= -->
<!-- التواصل -->
<!-- ========================= -->

<footer id="contact">

  <p>
    Nazeeka Designs © 2026
  </p>

  <p>
    للطلب والتواصل معنا
  </p>

</footer>


<!-- ========================= -->
<!-- JavaScript -->
<!-- ========================= -->

<script>


/* رقم واتساب */

const whatsappNumber =
"201029153023";


/* فتح فورم الطلب */

function openOrder(product){

  document.getElementById("orderBox")
    .style.display = "block";


  document.getElementById("productName")
    .value = product;


  document.getElementById("orderBox")
    .scrollIntoView({

      behavior:"smooth",

      block:"center"

    });

}


/* إغلاق الفورم */

function closeOrder(){

  document.getElementById("orderBox")
    .style.display = "none";

}


/* إرسال الطلب */

function sendOrder(){


  const name =
    document
    .getElementById("customerName")
    .value
    .trim();


  const phone =
    document
    .getElementById("customerPhone")
    .value
    .trim();


  const address =
    document
    .getElementById("customerAddress")
    .value
    .trim();


  const product =
    document
    .getElementById("productName")
    .value;


  const size =
    document
    .getElementById("size")
    .value;


  const quantity =
    document
    .getElementById("quantity")
    .value;


  /* التأكد من البيانات */

  if(
    !name ||
    !phone ||
    !address ||
    !product ||
    !size
  ){

    alert(
      "من فضلك اكملي كل بيانات الطلب ❤️"
    );

    return;

  }


  /* رسالة الواتساب */

  const message =

`طلب جديد من Nazeeka Designs

الاسم: ${name}

رقم الموبايل: ${phone}

العنوان: ${address}

القطعة: ${product}

المقاس: ${size}

الكمية: ${quantity}`;


  /* فتح واتساب */

  const whatsappURL =

    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);


  window.open(
    whatsappURL,
    "_blank"
  );

}

</script>


</body>

</html>
